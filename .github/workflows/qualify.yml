name: Qualify Env Registry source

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Full commit SHA of the selected env-registry ref
        type: string
        required: true
      flow_registry_sha:
        description: Full commit SHA of flowai-flow-registry
        type: string
        required: true
      task_manager_sha:
        description: Full commit SHA of flowai-task-manager
        type: string
        required: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      FLOW_REGISTRY_SHA: ${{ inputs.flow_registry_sha }}
      TASK_MANAGER_SHA: ${{ inputs.task_manager_sha }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Verify dispatch SHAs
        shell: bash
        run: |
          for input in EXPECTED_SOURCE_SHA FLOW_REGISTRY_SHA TASK_MANAGER_SHA; do
            if [[ ! "${!input}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "$input must be a 40-digit hexadecimal commit SHA." >&2
              exit 1
            fi
          done
          if [[ "$GITHUB_SHA" != "${EXPECTED_SOURCE_SHA,,}" ]]; then
            echo 'The dispatch ref does not resolve to expected_source_sha.' >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout and stage pinned publisher schemas
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" != "${EXPECTED_SOURCE_SHA,,}" ]]; then
            echo 'The checkout does not match expected_source_sha.' >&2
            exit 1
          fi
          if [[ ! -f go.mod || ! -f qualification/gitea-declarations.json ]]; then
            echo 'Dispatch on the reviewed standalone candidate branch.' >&2
            exit 1
          fi

          contracts="$(mktemp -d "$RUNNER_TEMP/env-registry-contracts.XXXXXXXX")"
          while read -r path digest; do
            publisher="${path%%/*}"
            case "$publisher" in
              flow-registry) sha="$FLOW_REGISTRY_SHA" ;;
              task-manager) sha="$TASK_MANAGER_SHA" ;;
              *) exit 1 ;;
            esac
            url="https://raw.githubusercontent.com/pandops/flowai-$publisher/${sha,,}/${path#*/}"
            mkdir -p "$contracts/${path%/*}"
            status="$(curl -q --silent --show-error --fail --proto '=https' --max-time 30 \
              --output "$contracts/$path" --write-out '%{http_code}' "$url")"
            if [[ "$status" != 200 ]]; then
              echo "Unexpected HTTP status $status for $url." >&2
              exit 1
            fi
            printf '%s  %s\n' "$digest" "$contracts/$path" | sha256sum --check --status
            jq -e 'type == "object"' "$contracts/$path" > /dev/null
            printf '%s ' "$url"
            (cd "$contracts" && sha256sum "$path")
          done <<'SCHEMAS'
          flow-registry/schemas/defs.schema.json d26e3cea5ff72963de45b933c2eff365d04280cc00fee3c6e76668778f597077
          flow-registry/schemas/error.reply.schema.json f8e2d07fc5d530e3fe522b952cc8d44dad57ddb84311b8fb32bec520ed3f7dad
          flow-registry/schemas/service.flow-owner.request.schema.json 8469dd88749a8fd1beff67df971057dc1161ed3c3dc8eafc78408d849313f6c7
          flow-registry/schemas/service.flow-owner.reply.schema.json 697fba1df88e8f5401878a751f6b6ba11ce310f4657c6b9289541a9f08342846
          task-manager/schemas/defs.schema.json 5bb6eea9a1419dd7019c4a1998a83e57e71c277c3ecedd2f13f67c6a1023adc6
          task-manager/schemas/error.reply.schema.json 59fa187d28347ea05a517c81ee312bee4041736fd36d906c5f0234a88f7f0c46
          task-manager/schemas/event.archived.schema.json 9ee06116336c045dce14d761a6d50e3e4b5cc842c3f12c54885e04ddfa36870f
          task-manager/schemas/service.claim-current.request.schema.json 55a572ea659534944f51d4d0f1c43a9a9972e1bab31b167918bcf78c0a5f30f3
          task-manager/schemas/service.claim-current.reply.schema.json 723dce542a4d56a9bb4dbecc8857b4ca197f91cefd7b3813aa70aa1c17fe858d
          SCHEMAS
          printf 'FLOWAI_ENV_REGISTRY_SCHEMA_DIR=%s\n' "$contracts" >> "$GITHUB_ENV"

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.2'
          cache: false

      - name: Unit tests
        id: unit_tests
        shell: bash
        run: go test -mod=readonly -count=1 -coverpkg=./... -v ./...

      - name: PostgreSQL integration tests and fixture teardown
        id: integration_tests
        shell: bash
        run: |
          docker pull --platform linux/amd64 docker.io/library/postgres@sha256:a85daf0dbd5e79586e850e3fe4b21b796799828ad015ce2166aeb98cc24da61c
          export FLOWAI_RESOURCE_LEDGER
          FLOWAI_RESOURCE_LEDGER="$(mktemp "$RUNNER_TEMP/env-registry-postgres.XXXXXXXX")"
          test_status=0
          go test -mod=readonly -count=1 -tags=integration -v ./test || test_status=$?
          [[ -s "$FLOWAI_RESOURCE_LEDGER" ]]
          jq -er 'select(.kind == "containers") | .selector' "$FLOWAI_RESOURCE_LEDGER" |
            while IFS= read -r selector; do
              remaining="$(docker ps --all --quiet --filter "$selector")"
              if [[ -n "$remaining" ]]; then
                echo "PostgreSQL fixture still exists for $selector." >&2
                exit 1
              fi
              echo "Verified PostgreSQL fixture absence for $selector."
            done
          exit "$test_status"

      - name: Build local Linux image
        id: image_build
        shell: bash
        run: |
          docker build --platform linux/amd64 -f Containerfile --iidfile "$RUNNER_TEMP/env-registry.iid" .
          cat "$RUNNER_TEMP/env-registry.iid"

      - name: Verify and package the qualified OCI image
        shell: bash
        env:
          QUALIFICATION_INPUTS: ${{ toJSON(inputs) }}
          UNIT_TESTS: ${{ steps.unit_tests.outcome }}
          INTEGRATION_TESTS: ${{ steps.integration_tests.outcome }}
          IMAGE_BUILD: ${{ steps.image_build.outcome }}
        run: |
          set -euo pipefail
          [[ "$UNIT_TESTS" == success ]]
          [[ "$INTEGRATION_TESTS" == success ]]
          [[ "$IMAGE_BUILD" == success ]]
          [[ "$(skopeo --version)" == "skopeo version 1.13.3" ]]
          [[ "$(jq --version)" == "jq-1.7" ]]
          jq -e --arg source "$GITHUB_SHA" '(.expected_source_sha | ascii_downcase) == $source and all(.[]; test("^[a-fA-F0-9]{40}$"))' <<<"$QUALIFICATION_INPUTS" >/dev/null
          image_id="$(cat "$RUNNER_TEMP/env-registry.iid")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$(docker image inspect --format '{{ .Id }}' "$image_id")" == "$image_id" ]]
          layout="$RUNNER_TEMP/qualified-oci-layout"
          skopeo copy --format oci "docker-daemon:$image_id" "oci:$layout:qualified"
          manifest="$(jq -er '
            select(.schemaVersion == 2 and (.manifests | length) == 1)
            | .manifests[0]
            | select(.mediaType == "application/vnd.oci.image.manifest.v1+json")
            | .digest | select(test("^sha256:[a-f0-9]{64}$"))
          ' "$layout/index.json")"
          cd "$layout"
          manifest_path="blobs/sha256/${manifest#sha256:}"
          printf '%s  %s\n' "${manifest#sha256:}" "$manifest_path" | sha256sum --check
          config="$(jq -er '.config.digest | select(test("^sha256:[a-f0-9]{64}$"))' "$manifest_path")"
          skopeo inspect --config "docker-daemon:$image_id" | jq -cS . > "$RUNNER_TEMP/source-oci-config.json"
          jq -cS . "blobs/sha256/${config#sha256:}" | cmp "$RUNNER_TEMP/source-oci-config.json" -
          jq -er '
            [.config, .layers[]][].digest
            | if test("^sha256:[a-f0-9]{64}$") then sub("^sha256:"; "") else error("invalid OCI digest") end
            | "\(.)  blobs/sha256/\(.)"
          ' "$manifest_path" | sha256sum --check
          jq -e '.os == "linux" and .architecture == "amd64"' "blobs/sha256/${config#sha256:}" >/dev/null

          # Verify that conversion retained Docker's ordered, uncompressed layer identities.
          layers="$(docker image inspect --format '{{json .RootFS.Layers}}' "$image_id")"
          jq -e --argjson layers "$layers" '
            .rootfs.type == "layers" and .rootfs.diff_ids == $layers and (.rootfs.diff_ids | length) > 0
          ' "blobs/sha256/${config#sha256:}" >/dev/null

          artifact="$RUNNER_TEMP/qualified-oci"
          mkdir "$artifact"
          tar -cf "$artifact/image.oci.tar" oci-layout index.json blobs
          cd "$artifact"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" \
            --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg imageId "$image_id" --arg manifest "$manifest" --arg config "$config" \
            --arg job "$GITHUB_JOB" --argjson inputs "$QUALIFICATION_INPUTS" \
            --arg unit_tests "$UNIT_TESTS" --arg integration_tests "$INTEGRATION_TESTS" --arg image_build "$IMAGE_BUILD" \
            '{job:$job,inputs:$inputs,steps:{unit_tests:$unit_tests,integration_tests:$integration_tests,image_build:$image_build},repository:$repository,ref:$ref,source:$source,run:$run,attempt:$attempt,imageId:$imageId,manifest:$manifest,config:$config}' > receipt.json
          sha256sum image.oci.tar receipt.json > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload qualified OCI archive
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-oci-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qualified-oci/image.oci.tar
            ${{ runner.temp }}/qualified-oci/receipt.json
            ${{ runner.temp }}/qualified-oci/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
