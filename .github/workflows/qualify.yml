name: Qualify and publish env-registry

on:
  workflow_dispatch:
    inputs:
      expected_schema_inputs:
        description: JSON array of exact publisher schema inputs
        required: true
        type: string
      reuse_image:
        description: Existing qualified image pin as JSON when production inputs are unchanged
        required: false
        type: string
      expected_source_sha:
        description: Full commit SHA of the selected env-registry ref
        type: string
        required: true
      flow_registry_sha:
        description: Full commit SHA of flowai-flow-registry
        type: string
        required: true
      task_manager_sha:
        description: Full commit SHA of flowai-task-manager
        type: string
        required: true

permissions:
  contents: read

jobs:
  application:
    name: Build and test the application
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      stage: ${{ steps.version.outputs.stage }}
      production_identity: ${{ steps.version.outputs.production_identity }}
      reuse_digest: ${{ steps.version.outputs.reuse_digest }}
      build_source_revision: ${{ steps.version.outputs.build_source_revision }}
      binary_artifact_id: ${{ steps.binary.outputs.artifact-id }}
      binary_sha256: ${{ steps.compile.outputs.sha256 }}
      schema_inputs: ${{ steps.schema.outputs.inputs }}
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      FLOW_REGISTRY_SHA: ${{ inputs.flow_registry_sha }}
      TASK_MANAGER_SHA: ${{ inputs.task_manager_sha }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Verify dispatch SHAs
        shell: bash
        run: |
          for input in EXPECTED_SOURCE_SHA FLOW_REGISTRY_SHA TASK_MANAGER_SHA; do
            if [[ ! "${!input}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "$input must be a 40-digit hexadecimal commit SHA." >&2
              exit 1
            fi
          done
          if [[ "$GITHUB_SHA" != "${EXPECTED_SOURCE_SHA,,}" ]]; then
            echo 'The dispatch ref does not resolve to expected_source_sha.' >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout and stage pinned publisher schemas
        shell: bash
        run: |
          (
          if [[ "$(git rev-parse HEAD)" != "${EXPECTED_SOURCE_SHA,,}" ]]; then
            echo 'The checkout does not match expected_source_sha.' >&2
            exit 1
          fi
          if [[ ! -f go.mod || ! -f qualification/gitea-declarations.json ]]; then
            echo 'Dispatch on the reviewed standalone candidate branch.' >&2
            exit 1
          fi

          contracts="$(mktemp -d "$RUNNER_TEMP/env-registry-contracts.XXXXXXXX")"
          while read -r path digest; do
            publisher="${path%%/*}"
            case "$publisher" in
              flow-registry) sha="$FLOW_REGISTRY_SHA" ;;
              task-manager) sha="$TASK_MANAGER_SHA" ;;
              *) exit 1 ;;
            esac
            url="https://raw.githubusercontent.com/pandops/flowai-$publisher/${sha,,}/${path#*/}"
            mkdir -p "$contracts/${path%/*}"
            status="$(curl -q --silent --show-error --fail --proto '=https' --max-time 30 \
              --output "$contracts/$path" --write-out '%{http_code}' "$url")"
            if [[ "$status" != 200 ]]; then
              echo "Unexpected HTTP status $status for $url." >&2
              exit 1
            fi
            printf '%s  %s\n' "$digest" "$contracts/$path" | sha256sum --check --status
            jq -e 'type == "object"' "$contracts/$path" > /dev/null
            printf '%s ' "$url"
            (cd "$contracts" && sha256sum "$path")
          done <<'SCHEMAS'
          flow-registry/schemas/defs.schema.json d26e3cea5ff72963de45b933c2eff365d04280cc00fee3c6e76668778f597077
          flow-registry/schemas/error.reply.schema.json f8e2d07fc5d530e3fe522b952cc8d44dad57ddb84311b8fb32bec520ed3f7dad
          flow-registry/schemas/service.flow-owner.request.schema.json 8469dd88749a8fd1beff67df971057dc1161ed3c3dc8eafc78408d849313f6c7
          flow-registry/schemas/service.flow-owner.reply.schema.json 697fba1df88e8f5401878a751f6b6ba11ce310f4657c6b9289541a9f08342846
          task-manager/schemas/defs.schema.json 5bb6eea9a1419dd7019c4a1998a83e57e71c277c3ecedd2f13f67c6a1023adc6
          task-manager/schemas/error.reply.schema.json 59fa187d28347ea05a517c81ee312bee4041736fd36d906c5f0234a88f7f0c46
          task-manager/schemas/event.archived.schema.json 9ee06116336c045dce14d761a6d50e3e4b5cc842c3f12c54885e04ddfa36870f
          task-manager/schemas/service.claim-current.request.schema.json 55a572ea659534944f51d4d0f1c43a9a9972e1bab31b167918bcf78c0a5f30f3
          task-manager/schemas/service.claim-current.reply.schema.json 723dce542a4d56a9bb4dbecc8857b4ca197f91cefd7b3813aa70aa1c17fe858d
          SCHEMAS
          printf 'FLOWAI_ENV_REGISTRY_SCHEMA_DIR=%s\n' "$contracts" >> "$GITHUB_ENV"
          ) | tee "$RUNNER_TEMP/schema-inputs.log"

      - name: Check the tested publisher schema bytes
        id: schema
        shell: bash
        env:
          EXPECTED_SCHEMA_INPUTS: ${{ inputs.expected_schema_inputs }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          import re

          pins = json.loads(os.environ["EXPECTED_SCHEMA_INPUTS"])
          expected = {
              (pin["repository"], pin["path"], pin["sourceRevision"], pin["digest"])
              for pin in pins
          }
          observed = set()
          log = Path(os.environ["RUNNER_TEMP"]) / "schema-inputs.log"
          for line in log.read_text().splitlines():
              if not line.startswith("https://raw.githubusercontent.com/"):
                  continue
              match = re.fullmatch(
                  r"https://raw\.githubusercontent\.com/(pandops/flowai-[a-z0-9-]+)/"
                  r"([a-f0-9]{40})/(schemas/[a-zA-Z0-9_./-]+\.json) ([a-f0-9]{64})[ ]+.+",
                  line,
              )
              if not match:
                  raise SystemExit("Invalid publisher schema evidence")
              repository, revision, path, checksum = match.groups()
              entry = (repository, path, revision, "sha256:" + checksum)
              if entry in observed:
                  raise SystemExit("Duplicate publisher schema")
              observed.add(entry)
          if not observed or len(pins) != len(expected) or observed != expected:
              raise SystemExit("Tested schema bytes differ from requested inputs")
          print("inputs=" + json.dumps(pins, separators=(",", ":")))
          PYTHON

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.2'
          cache: false

      - name: Unit tests
        id: unit_tests
        shell: bash
        run: go test -mod=readonly -count=1 -coverpkg=./... -v ./...

      - name: PostgreSQL integration tests and fixture teardown
        id: integration_tests
        shell: bash
        run: |
          docker pull --platform linux/amd64 docker.io/library/postgres@sha256:a85daf0dbd5e79586e850e3fe4b21b796799828ad015ce2166aeb98cc24da61c
          export FLOWAI_RESOURCE_LEDGER
          FLOWAI_RESOURCE_LEDGER="$(mktemp "$RUNNER_TEMP/env-registry-postgres.XXXXXXXX")"
          test_status=0
          go test -mod=readonly -count=1 -tags=integration -v ./test || test_status=$?
          [[ -s "$FLOWAI_RESOURCE_LEDGER" ]]
          jq -er 'select(.kind == "containers") | .selector' "$FLOWAI_RESOURCE_LEDGER" |
            while IFS= read -r selector; do
              remaining="$(docker ps --all --quiet --filter "$selector")"
              if [[ -n "$remaining" ]]; then
                echo "PostgreSQL fixture still exists for $selector." >&2
                exit 1
              fi
              echo "Verified PostgreSQL fixture absence for $selector."
            done
          exit "$test_status"

      - name: Build the Linux application binary
        id: compile
        if: ${{ inputs.reuse_image == '' }}
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/application"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -buildvcs=false -trimpath \
            -ldflags='-s -w' -o "$RUNNER_TEMP/application/app" ./cmd/env-registry
          checksum="$(sha256sum "$RUNNER_TEMP/application/app")"
          printf 'sha256=%s\n' "${checksum%% *}" >> "$GITHUB_OUTPUT"

      - name: Prepare the binary from this attempt
        if: ${{ inputs.reuse_image == '' }}
        shell: bash
        run: mv "$RUNNER_TEMP/application/app" "$RUNNER_TEMP/application/app-$GITHUB_RUN_ATTEMPT"

      - name: Retain the application binary
        id: binary
        if: ${{ inputs.reuse_image == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ github.run_attempt }}
          path: ${{ runner.temp }}/application/app-${{ github.run_attempt }}
          archive: false
          retention-days: 7
          if-no-files-found: error

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ inputs.reuse_image == '' }}
        with:
          node-version: '24.20.0'
          package-manager-cache: false

      - name: Resolve the artifact version
        id: version
        shell: bash
        env:
          REUSE_PIN: ${{ inputs.reuse_image }}
          PRODUCTION_PATHS: "[\"Containerfile.runtime\",\"cmd\",\"internal\",\"go.mod\",\"go.sum\",\"schemas\"]"
          INITIAL_IMPORT: ""
        run: |
          mapfile -t paths < <(jq -er '.[]' <<< "$PRODUCTION_PATHS")
          workflow_json() {
            git show "$1:$2" | yq -p yaml -o json '.'
          }
          production_tree() {
            local source="$1"
            {
              git ls-tree -r "$source" -- "${paths[@]}" | sed '/_test\.go$/d' || return
              workflow_json "$source" .github/workflows/qualify.yml |
                jq -ce '.jobs.application as $job | [$job."runs-on", $job.env.GOTOOLCHAIN, $job.env.GOWORK, ($job.steps[] | select((.uses // "") | startswith("actions/setup-go@")) | {uses,with}), ($job.steps[] | select(.id == "compile") | {shell,run,env})] | select(length == 5)' || return
              workflow_json "$source" .github/workflows/v0052-build-push.yml |
                jq -ce '.jobs.publish as $job | [$job."runs-on", ($job.steps[] | select(.id == "assemble") | {shell,run,env})] | select(length == 2)' || return
            } | sha256sum | cut -d ' ' -f1
          }
          identity="$(production_tree "$GITHUB_SHA")"
          printf 'production_identity=sha256:%s\n' "$identity" >> "$GITHUB_OUTPUT"
          release_branch="$GITHUB_REF_NAME"
          stable='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          version_pattern="^${stable}$"
          stage=stable
          if [[ "$release_branch" != master ]]; then
            stage=snapshot
            # Give each distinct input set its own prerelease channel. This
            # also separates it from the earlier pilot snapshots in GHCR.
            channel="snapshot-${identity:0:16}"
            release_branch="$channel"
            version_pattern="^${stable}-${channel}\.[1-9][0-9]*$"
          fi
          printf 'stage=%s\n' "$stage" >> "$GITHUB_OUTPUT"

          if [[ -n "$REUSE_PIN" ]]; then
            build_source="$(jq -er '.buildSourceRevision | select(test("^[a-f0-9]{40}$"))' <<< "$REUSE_PIN")"
            digest="$(jq -er '.imageDigest | select(test("^sha256:[a-f0-9]{64}$"))' <<< "$REUSE_PIN")"
            version="$(jq -er .version <<< "$REUSE_PIN")"
            [[ "$(production_tree "$build_source")" == "$identity" ]]
            if [[ "$stage" == stable ]]; then
              [[ "$version" =~ ^${stable}$ ]]
            else
              [[ "$version" =~ ^${stable}-[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*$ ]]
            fi
            printf 'version=%s\nbuild_source_revision=%s\nreuse_digest=%s\n' \
              "$version" "$build_source" "$digest" >> "$GITHUB_OUTPUT"
            exit
          fi
          printf 'build_source_revision=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

          mapfile -t existing < <(git tag --points-at "$GITHUB_SHA" | awk '/^v/ {print substr($0,2)}')
          for version in "${existing[@]}"; do
            if [[ "$version" =~ $version_pattern ]]; then
              printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
              exit
            fi
          done

          lock_root="$(mktemp -d "$RUNNER_TEMP/semantic-release.XXXXXXXX")"
          trusted=https://raw.githubusercontent.com/pandops/flowai-team-registry/c18e7cdde5d5b976f549d1dc486f60776cbb8718/.github/semantic-release
          for file in package.json package-lock.json; do
            curl -q --fail --silent --show-error --proto '=https' --max-time 30 "$trusted/$file" -o "$lock_root/$file"
          done
          (cd "$lock_root" && sha256sum --check <<'LOCKS'
          891ec3a55b9fccf0b49fe0ac0a98f9e9fd5bbd7f1743e0f0e51d6286a178d16b  package.json
          aa53698b9420885d999a383abe2f5fafa453bd5aa938dc9ff3ce3e1ef42551a9  package-lock.json
          LOCKS
          npm ci --ignore-scripts --no-audit --no-fund)

          mirror="$RUNNER_TEMP/version.git"
          metadata="$RUNNER_TEMP/version-metadata"
          git clone --quiet --bare --shared "$GITHUB_WORKSPACE" "$mirror"
          git -C "$mirror" update-ref "refs/heads/$release_branch" "$GITHUB_SHA"
          if [[ "$release_branch" != master ]]; then
            git -C "$mirror" update-ref refs/heads/master "$(git rev-parse refs/remotes/origin/master)"
          fi
          git init --quiet --initial-branch="$release_branch" "$metadata"
          git -C "$metadata" remote add origin "$mirror"
          git -C "$metadata" fetch --quiet --tags origin "refs/heads/$release_branch:refs/version-source"
          git -C "$metadata" update-ref "refs/heads/$release_branch" "$GITHUB_SHA"

          jq -n --arg branch "$release_branch" --arg header "$INITIAL_IMPORT" '{
            branches: (["master"] + if $branch == "master" then [] else [{name:$branch, prerelease:$branch, channel:$branch}] end),
            plugins: [["@semantic-release/commit-analyzer",
                       {releaseRules: (if $header == "" then [] else [{header:$header,release:"minor"}] end)}]],
            tagFormat: "v${version}"
          }' > "$metadata/.releaserc.json"
          log="$RUNNER_TEMP/semantic-release.log"
          (
            cd "$metadata"
            env -i PATH="$PATH" HOME="$metadata" LANG=C.UTF-8 NO_COLOR=1 \
              GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 \
              "$lock_root/node_modules/.bin/semantic-release" --dry-run --no-ci --repository-url "$mirror"
          ) 2>&1 | tee "$log"
          version="$(sed -n 's/^.*[Tt]he next release version is //p' "$log")"
          [[ "$version" =~ $version_pattern ]]
          grep -Fq "Skip v$version tag creation in dry-run mode" "$log"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  container:
    name: Build and publish the runtime container
    needs: application
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/v0052-build-push.yml
    with:
      binary_artifact_id: ${{ needs.application.outputs.binary_artifact_id }}
      binary_sha256: ${{ needs.application.outputs.reuse_digest == '' && needs.application.outputs.binary_sha256 || '' }}
      version: ${{ needs.application.outputs.version }}
      runtime_files: '[]'
      qualification: ${{ format('{{"unit":"success","integration":"success","schemaInputs":{0}}}', needs.application.outputs.schema_inputs) }}
      reuse_digest: ${{ needs.application.outputs.reuse_digest }}
      build_source_revision: ${{ needs.application.outputs.build_source_revision }}
      production_identity: ${{ needs.application.outputs.production_identity }}
